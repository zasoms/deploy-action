name: 'wescrm deploy action'
description: 'wescrm部署action'
inputs:
  type:
    description: '类型：web'
    required: true
    default: 'message'
  
  app: 
    description: '项目名称'

  branch: 
    description: '项目分支名称'

  input: 
    description: '目录地址'

  # message
  content:
    description: '发送内容'

  # web
  host: 
    description: '服务器host'
  port: 
    description: '服务器port'
  username: 
    description: '服务器username'
  password: 
    description: '服务器password（与 key 二选一，已废弃）'
  key:
    description: '服务器 SSH 私钥全文（优先使用）'
  uploadMode:
    description: '上传方式：sftp（默认）或 stdin（服务端禁 sftp 时用，需要服务端支持 upload 指令）'
    required: false
    default: 'sftp'
  knownHosts:
    description: 'known_hosts 文件内容，用于校验服务器主机指纹（可选）'
    required: false
  script:
    description: '自定义远程指令（默认 deploy <目标目录> <包名> <清理项>）'
  output: 
    description: '服务器部署地址'
  clean:
    description: '是否清理目标目录'
    required: false
    default: 'false'
  cleanPaths:
    description: '要清理的文件或目录列表，多个路径用逗号分隔。例如：dist,temp,logs'
    required: false

runs:
  using: 'node12'
  main: 'src/index.js'